name: 后端版本与镜像发布

on:
  push:
    branches: [main]
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'admin-web/**'
      - 'docs/**'
      - 'version.go'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - '.dockerignore'
      - '.gitmodules'
      - 'THIRD_PARTY_NOTICES.txt'
      - 'native/**'
      - 'third_party/**'
      - 'scripts/fetch_engine_resources.py'
      - 'scripts/release/**'
      - '.github/workflows/backend-release.yml'
      - '!**/*.md'
  workflow_dispatch:

permissions: {}

concurrency:
  group: backend-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'metasequoiaime/msime-cloud'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      revision: ${{ steps.release.outputs.revision }}
    steps:
      - name: 检出最新主分支及完整标签
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          # main 受规则集保护、只接受 PR，GITHUB_TOKEN 进不了绕过名单；发布要把版本提交和标签原子推上 main，所以用规则集放行的写权限 deploy key（secret RELEASE_DEPLOY_KEY）检出和推送。
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: 验证管理后台产物
        run: |
          npm install --global pnpm@10.15.0
          pnpm --dir admin-web install --frozen-lockfile
          pnpm --dir admin-web lint
          pnpm --dir admin-web build
          test -f admin-web/dist/index.html
      - name: 验证待发布源码
        run: |
          python3 scripts/sync_contract.py --check
          python3 scripts/generate_openapi.py --check
          python3 -m unittest discover -s scripts/release -p 'test_*.py'
          # 与 CI 一样缩短测试内的基准校准时间，保留全部回归断言。
          go test -race -benchtime=50ms ./...
          go vet ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: 更新版本并原子推送标签
        id: release
        run: python3 scripts/release/backend.py

  image:
    needs: release
    # 验证期间 main 前进、新提交已排上下一次发布时，release 让位且不给出版本，这里随之跳过。
    if: needs.release.outputs.tag != ''
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - name: 检出精确发布提交
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.revision }}
          submodules: recursive
          persist-credentials: false
      - name: 登录 GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 配置 ARM64 原生构建模拟器
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - name: 配置 Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: 构建并发布镜像
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/metasequoiaime/msime-backend:${{ needs.release.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/metasequoiaime/msime-cloud
            org.opencontainers.image.revision=${{ needs.release.outputs.revision }}
            org.opencontainers.image.version=${{ needs.release.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
          VERSION: ${{ needs.release.outputs.version }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "水杉输入法后端 v${VERSION}" --generate-notes
          fi

  cli:
    needs: [release, image]
    # 命令行附在 image 创建的同一个 Release 上，所以跟着它跳过。
    if: needs.release.outputs.tag != ''
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: 检出精确发布提交
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: 构建 msime-cloud 命令行并上传到 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
          VERSION: ${{ needs.release.outputs.version }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir dist
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64; do
            os="${target%/*}" arch="${target#*/}"
            name="msime-cloud-${VERSION}-${os}-${arch}"
            exe=msime-cloud
            if [ "$os" = windows ]; then exe=msime-cloud.exe; fi
            mkdir "dist/$name"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o "dist/$name/$exe" ./cmd/msime-cloud
            cp THIRD_PARTY_NOTICES.txt "dist/$name/"
            if [ "$os" = windows ]; then
              (cd dist && zip -qr "$name.zip" "$name")
            else
              tar -C dist -czf "dist/$name.tar.gz" "$name"
            fi
          done
          (cd dist && sha256sum ./*.tar.gz ./*.zip > SHA256SUMS)
          gh release upload "$TAG" dist/*.tar.gz dist/*.zip dist/SHA256SUMS --clobber

  announce:
    needs: [release, image, cli]
    # 等镜像和命令行资产都上传完成后再分发，避免社交帖子指向不完整的 Release。
    if: needs.release.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    concurrency:
      group: social-${{ needs.release.outputs.tag }}
      cancel-in-progress: false
    steps:
      - name: 检出发布提交中的分发脚本
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.release.outputs.revision }}
          persist-credentials: false

      - name: 检查社交分发配置
        id: config
        env:
          SOCIAL_WEBHOOK_URL: ${{ secrets.SOCIAL_WEBHOOK_URL }}
          SOCIAL_WEBHOOK_SECRET: ${{ secrets.SOCIAL_WEBHOOK_SECRET }}
        run: |
          if [ -n "$SOCIAL_WEBHOOK_URL" ] && [ -n "$SOCIAL_WEBHOOK_SECRET" ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo '未配置 SOCIAL_WEBHOOK_URL 和 SOCIAL_WEBHOOK_SECRET，跳过社交分发。'
          fi

      - name: 读取完整 Release
        if: steps.config.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release.outputs.tag }}
        run: gh release view "$TAG" --repo "$GH_REPO" --json tagName,name,body,url,publishedAt,targetCommitish > release.json

      - name: 推送社交分发 webhook
        if: steps.config.outputs.enabled == 'true'
        env:
          SOCIAL_WEBHOOK_URL: ${{ secrets.SOCIAL_WEBHOOK_URL }}
          SOCIAL_WEBHOOK_SECRET: ${{ secrets.SOCIAL_WEBHOOK_SECRET }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.release.outputs.tag }}
        run: python3 scripts/release/social.py --release-json release.json --repo "$REPO" --tag "$TAG"
