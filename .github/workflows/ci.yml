name: Go 后端验证
# 分支上的推送由 pull_request 覆盖，push 只在 main 上触发，同一次改动不再跑两遍。
on:
  push:
    branches: [main]
  pull_request:
env:
  PYTHONUTF8: "1"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
jobs:
  security:
    name: Go 已知漏洞检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  admin-web:
    name: Admin Web 构建与检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - run: npm install --global pnpm@10.15.0
      - run: pnpm --dir admin-web install --frozen-lockfile
      - run: pnpm --dir admin-web lint
      - run: pnpm --dir admin-web test
      - run: pnpm --dir admin-web build
      - run: test -f admin-web/dist/index.html

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - run: npm install --global pnpm@10.15.0
      - run: pnpm --dir admin-web install --frozen-lockfile
      - run: pnpm --dir admin-web build
      - run: python3 scripts/sync_contract.py --check
      - run: python3 scripts/generate_openapi.py --check
      - run: python3 -m unittest discover -s scripts/release -p "test_*.py"
      - run: python3 -m unittest discover -s scripts -p "test_qq_command_panel.py"
      - run: python3 -m unittest discover -s scripts -p "test_native_trigger.py"
      # 测试内的回归基准按 50 毫秒校准，减少每个断言默认 1 秒的开销；正式耗时基准单独运行。
      - run: go test -race -benchtime=50ms ./...
      - run: go vet ./...
      - run: go build ./cmd/msime-server

  user-database:
    name: 用户体系 PostgreSQL 集成测试
    runs-on: ubuntu-latest
    services:
      postgres:
        # 带 pgvector 的官方镜像：QQ 答疑的向量索引（account/qq_knowledge.go）要用它，生产的 CloudNativePG 镜像也带这个扩展。
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: local-auth-test
          POSTGRES_DB: msime_auth_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      MSIME_TEST_DATABASE_URL: postgres://postgres:local-auth-test@127.0.0.1:5432/msime_auth_test?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - run: npm install --global pnpm@10.15.0
      - run: pnpm --dir admin-web install --frozen-lockfile
      - run: pnpm --dir admin-web build
      - run: python3 -m unittest discover -s scripts -p 'test_*seed*.py'
      - run: python3 -m unittest discover -s scripts -p 'test_go_coverage.py'
      # 拉取请求上的覆盖率门禁在这里：它在每个拉取请求上跑，失败就合不进去。没有原生引擎，只量 internal/account 与 internal/server，下限见 check_go_coverage.py 的 DATABASE_MINIMUMS。`-count=1` 的理由见原生引擎任务；`-p 1` 让两个包不同时改同一个测试库。
      # 与原生覆盖率任务保持相同的整包时限；默认 10 分钟已不足，超时导出覆盖率还会污染当时的分配计数。
      - run: go test -race -benchtime=50ms -count=1 -p 1 -timeout=20m -coverpkg=./internal/account,./internal/server -coverprofile=database.cover ./internal/account ./internal/server
      - run: python3 scripts/check_go_coverage.py --database database.cover

  # 判断这次改动有没有碰到原生引擎：引擎子模块、调用代码及其测试、原生资源、镜像和验证门禁。路径规则由 test_native_trigger.py 检查，新增依赖引擎环境变量的测试不能漏跑。拉取请求比对目标分支，main 上的推送比对推送前的提交；推送前的提交不可用（新建分支、强推）时按碰到处理。
  changes:
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.diff.outputs.native }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null || git diff --name-only "$BASE" HEAD | grep -qE '^(Dockerfile|\.dockerignore|\.github/workflows/ci\.yml|third_party/|native/|internal/engine/|internal/account/(candidate_actions_test|community_resource_apply[^/]*|community_resources[^/]*|dictionary[^/]*|positions[^/]*|ranking[^/]*|snapshot[^/]*|transaction_failure_test)\.go|internal/publictools/|cmd/msime-cloud/tools[^/]*\.go|internal/server/(input[^/]*|handlers|bot_words|word_submissions[^/]*|cloud_native_test|native_e2e_test|bot_public_tools[^/]*|bot_shuangpin_keys_test)\.go|internal/server/testdata/api-coverage\.json|scripts/(fetch_engine_resources|smoke_container|test_native|test_native_trigger|check_api_test_results|test_api_test_results|check_go_coverage|test_go_coverage)\.py)'; then
            echo "native=true" >> "$GITHUB_OUTPUT"
          else
            echo "native=false" >> "$GITHUB_OUTPUT"
          fi

  native-engine:
    name: 公共引擎与发布词库集成测试
    # 编译 Rust 引擎、跑带真实引擎的全量测试和全仓覆盖率门禁、构建生产镜像，单次十几分钟。拉取请求和 main 上的推送都只在碰到原生引擎时跑：main 上的推送不会等它，发版工作流同时就推出了镜像，每次都跑只是事后通知；平时的覆盖率回退由「用户体系 PostgreSQL 集成测试」在合并前拦下。
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-latest
    # Rust 引擎在 runner 上的编译结果按子模块提交缓存。
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: local-native-test
          POSTGRES_DB: msime_auth_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: true
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - run: npm install --global pnpm@10.15.0
      - run: pnpm --dir admin-web install --frozen-lockfile
      - run: pnpm --dir admin-web build
      # 引擎子模块和工具链没变时，直接复用上次的编译结果；键里带子模块提交，任何引擎改动都会重新编译。
      - id: engine
        run: echo "commit=$(git -C third_party/msime rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            third_party/msime/target
          key: native-engine-${{ runner.os }}-${{ steps.engine.outputs.commit }}-${{ hashFiles('third_party/msime/rust-toolchain.toml', 'third_party/msime/Cargo.lock') }}
      # msime-backend-engine from the msime submodule; rustup on the runner installs the toolchain its rust-toolchain.toml pins.
      - run: cd third_party/msime && cargo build -p msime-backend-engine --release --locked && install -D target/release/msime-backend-engine ../../bin/native/msime-engine
      - run: python3 scripts/fetch_engine_resources.py bin/resources
      - name: 验证真实原生查询和 HTTP 返回
        env:
          MSIME_ENGINE_TEST_BINARY: ${{ github.workspace }}/bin/native/msime-engine
          MSIME_ENGINE_TEST_RESOURCES: ${{ github.workspace }}/bin/resources
          MSIME_TEST_DATABASE_URL: postgres://postgres:local-native-test@127.0.0.1:5432/msime_auth_test?sslmode=disable
        # `-count=1` 关闭测试结果缓存。setup-go 按 go.sum 恢复的 GOCACHE 只在 go.sum 变化时更新，没有改动依赖的包（admin-web、internal/engine 等）会直接重放缓存里的覆盖率文件；`-coverpkg=./...` 时这些文件也列出它们没有导入的包，块位置却是缓存时的旧源码，合并后多出一批永远为 0 的旧块，把总覆盖率拉到门禁以下（2026-10 的 89.3% 就是旧版 `internal/server/handlers.go` 多出的 282 条语句）。
        run: |
          python3 scripts/test_native.py
          python3 -m unittest discover -s scripts -p 'test_api_test_results.py'
          python3 -m unittest discover -s scripts -p 'test_go_coverage.py'
          go test -race -benchtime=50ms -count=1 -p 1 -timeout=20m -json -coverpkg=./... -coverprofile=bin/api.cover ./... > bin/api-test-results.jsonl || { cat bin/api-test-results.jsonl; exit 1; }
          python3 scripts/check_api_test_results.py bin/api-test-results.jsonl
          python3 scripts/check_go_coverage.py bin/api.cover
      - name: 确认查询未修改基础词库
        run: python3 scripts/fetch_engine_resources.py bin/resources

      - name: 验证只读生产镜像与内置原生资源
        run: |
          docker build -t msime-server:verification .
          python3 scripts/smoke_container.py --image msime-server:verification --native
