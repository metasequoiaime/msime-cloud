name: CodeQL
on:
  schedule:
    # Daily at 00:00 Asia/Tokyo (UTC+09:00).
    - cron: '0 15 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: codeql-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    name: CodeQL / ${{ matrix.language }}
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - {language: actions, build-mode: none}
          # Go has no build-free extraction; autobuild compiles the module with the toolchain go.mod pins.
          - {language: go, build-mode: autobuild}
          - {language: javascript-typescript, build-mode: none}
          - {language: python, build-mode: none}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: '/language:${{ matrix.language }}'
