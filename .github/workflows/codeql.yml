name: CodeQL
on:
  schedule:
    # Daily at 00:00 Asia/Tokyo (UTC+09:00).
    - cron: '0 15 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: codeql-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    name: CodeQL / ${{ matrix.language }}
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - {language: actions, build-mode: none}
          # Go has no build-free extraction; autobuild compiles the module with the toolchain go.mod pins.
          - {language: go, build-mode: autobuild}
          - {language: javascript-typescript, build-mode: none}
          - {language: python, build-mode: none}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: matrix.language == 'go'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          category: '/language:${{ matrix.language }}'
