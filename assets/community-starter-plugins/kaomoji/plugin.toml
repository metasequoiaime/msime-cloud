# Type / and a trigger, e.g. /kx, to get the kaomoji as a candidate. Triggers are the pinyin initials of the mood.
schema_version = 1
kind = "command_table"
id = "kaomoji"
name = "颜文字"
version = "1.0.0"
license = "CC0-1.0"
author = "水杉输入法"
description = "常用颜文字：输入 / 加情绪的拼音首字母，如 /kx 开心、/ng 难过、/fp 掀桌。"
permissions = []

[[commands]]
trigger = "kx"
title = "开心"
template = "(＾▽＾)"

[[commands]]
trigger = "hh"
title = "哈哈"
template = "(≧∇≦)ﾉ"

[[commands]]
trigger = "ng"
title = "难过"
template = "(╥﹏╥)"

[[commands]]
trigger = "sq"
title = "生气"
template = "(╬▔皿▔)╯"

[[commands]]
trigger = "fp"
title = "掀桌"
template = "(╯°□°)╯︵ ┻━┻"

[[commands]]
trigger = "fz"
title = "扶桌"
template = "┬─┬ノ( º _ ºノ)"

[[commands]]
trigger = "tt"
title = "摊手"
template = "¯\\_(ツ)_/¯"

[[commands]]
trigger = "jy"
title = "惊讶"
template = "(⊙ˍ⊙)"

[[commands]]
trigger = "hx"
title = "害羞"
