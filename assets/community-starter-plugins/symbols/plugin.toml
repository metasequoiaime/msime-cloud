# Type / and a trigger, e.g. /ssd, to get the symbol as a candidate. Triggers are pinyin initials or a short English name.
schema_version = 1
kind = "command_table"
id = "symbols"
name = "常用符号"
version = "1.0.0"
license = "CC0-1.0"
author = "水杉输入法"
description = "不好打的常用符号：/ssd ℃、/dg ✓、/jt →、/rmb ¥、/c ©、/zj ≈ 等。"
permissions = []

[[commands]]
trigger = "ssd"
title = "摄氏度"
template = "℃"

[[commands]]
trigger = "hsd"
title = "华氏度"
template = "℉"

[[commands]]
trigger = "du"
title = "度"
template = "°"

[[commands]]
trigger = "dg"
title = "对勾"
template = "✓"

[[commands]]
trigger = "cha"
title = "叉"
template = "✗"

[[commands]]
trigger = "jt"
